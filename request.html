<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>リクエスト - VOCALOG</title>

  <script>
    (function() {
      const saved = localStorage.getItem("vocalog-theme") || "light";
      document.documentElement.setAttribute("data-theme", saved);
    })();
  </script>

  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <div id="header"></div>

  <main class="wrap">
    <div class="card">

      <h2 class="title">楽曲リクエスト</h2>

      <p class="muted">
        ※お送りいただいた内容を確認のうえ、順次掲載を検討いたします（すべてのリクエストにお応えできるとは限りません）
      </p>

      <div class="links" style="margin-top:12px;">
        <a class="link" target="_blank" rel="noopener" href="https://forms.gle/GxnaDBLykejfrMYw7">
          リクエストフォーム
        </a>
      </div>

      <div style="margin-top:28px; padding-top:24px; border-top:1px solid #eee;">

        <h2 class="title">公式X</h2>

        <p class="muted">
          毎週10曲ほどの追加予定曲の予告や、サイトの使い方などを発信中<br>
          お問い合わせは、XのDMまでご連絡ください
        </p>

        <div class="links" style="margin-top:12px;">
          <a class="link" target="_blank" rel="noopener" href="https://x.com/vocalog_jp">
            公式X
          </a>
        </div>

      </div>

    </div>
  </main>

  <script src="./theme.js"></script>

  <script type="module">
    import { headerHtml } from "./app.js"
    document.getElementById("header").innerHTML = headerHtml("request")
  </script>
</body>
</html>
