<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VOCALOG</title>
  <script>
    (function() {
      const saved = localStorage.getItem("vocalog-theme") || "light";
      document.documentElement.setAttribute("data-theme", saved);
    })();
  </script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="routerLoading" class="wrap" style="padding-top:40px;">読み込み中…</div>
  <script type="module">
    const pathname = location.pathname.replace(/\/$/, "");
    const routes = {
      "/index": ["index.html", "songlist.js"],
      "/producers": ["producers.html", "producers.js"],
      "/vocals": ["vocals.html", "vocals.js"],
      "/history": ["history.html", "history.js"],
      "/new": ["new.html", "new.js"],
      "/recommend": ["recommend.html", "recommend.js"],
      "/request": ["request.html", null],
    };

    let htmlFile = null;
    let moduleFile = null;
    if (routes[pathname]) {
      [htmlFile, moduleFile] = routes[pathname];
    } else {
      const m = pathname.match(/^\/(song|producer|vocal)\.(.+)$/);
      if (m) {
        htmlFile = `${m[1]}.html`;
        moduleFile = `${m[1]}.js`;
      }
    }

    const loading = document.getElementById("routerLoading");
    if (!htmlFile) {
      loading.textContent = "ページが見つかりません";
    } else {
      try {
        const response = await fetch(`./${htmlFile}`);
        if (!response.ok) throw new Error(String(response.status));
        const html = await response.text();
        const doc = new DOMParser().parseFromString(html, "text/html");

        document.title = doc.title || "VOCALOG";
        document.body.innerHTML = doc.body.innerHTML;

        // Run the existing theme script, then the page module.
        const theme = document.createElement("script");
        theme.src = "./theme.js";
        document.body.appendChild(theme);

        if (moduleFile) {
          await import(`./${moduleFile}`);
        }
      } catch (error) {
        document.body.innerHTML = `<main class="wrap"><div class="card"><p>読み込み失敗</p></div></main>`;
        console.error(error);
      }
    }
  </script>
</body>
</html>
