<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ボカロP - VOCALOG</title>

  <script>
    (function() {
      const saved = localStorage.getItem("vocalog-theme") || "light";
      document.documentElement.setAttribute("data-theme", saved);
    })();
  </script>
  
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="header"></div>

  <main class="wrap">
    <a class="link" href="./producers">← ボカロP一覧へ</a>
    <div id="content" class="card"></div>

    <div class="card">
      <h2 class="title">代表曲</h2>
      <p id="songsNote" class="muted"></p>
      <div id="songs" class="grid"></div>

    </div>

    <div class="card">
      <h2 class="title">人気曲</h2>
      <p id="popularNote" class="muted"></p>
      <div id="popularSongs" class="grid"></div>
    </div>
  </main>

  <script src="./theme.js"></script>
  <script type="module" src="./producer.js"></script>
</body>
</html>
